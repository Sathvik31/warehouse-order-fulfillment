spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5435/inventory_db
    username: inventory_user
    password: inventory_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

warehouse:
  default-id: W-DEFAULT

logging:
  level:
    com.warehouse.inventory: DEBUG
    org.hibernate.SQL: DEBUG